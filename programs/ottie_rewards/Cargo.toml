[package]
name = "ottie_rewards"
version = "1.0.0"
description = "Solana program"
edition = "2021"
license-file = "../../LICENSE"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "ottie_rewards"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "anchor-spl/token_2022"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.2.2", features = ["event-cpi"] }
anchor-spl = { version = "=1.2.2", default-features = false, features = ["token", "solana-v3"] }
solana-sha256-hasher = "=3.1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
